name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # Pin the tool versions (ruff/mypy/pytest) via the constraints file so an upstream
        # release can't silently break CI; the dev extra itself stays loose for local use.
        run: python -m pip install -c ci-constraints.txt -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src
