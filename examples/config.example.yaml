# mch - Mesh Herder
# Configuration reference — copy to /etc/meshherder/config.yaml and trim to what you need.
#
# mch is a daemon (mchd) that manages fleets of MeshCore repeater nodes.
# It connects via a locally attached gateway node (USB serial), sends remote CLI
# commands across the mesh, and keeps each managed node in its declared desired state.
# Think Ansible for your nodes — without needing SSH or IP connectivity to any of them.
#
# Project: https://github.com/rdmarsh/meshherder
# Docs:    https://github.com/rdmarsh/meshherder#readme
#
# Node passwords go in a separate secrets file (mode 0600).
# See examples/secrets.example.yaml for format.

gateway:
  # USB serial device for the gateway node.
  # On Linux/Raspberry Pi: plug in the node, then check `ls /dev/ttyACM* /dev/ttyUSB*`
  # - the new entry is your device. Most MeshCore nodes show up as /dev/ttyACM0.
  # A udev rule can create a stable symlink (e.g. /dev/meshcore0) so the path
  # does not change between reboots - see systemd/ for an example udev rule.
  device: /dev/ttyACM0
  baud: 115200

  # Optional: set/enforce this name on the gateway node on startup.
  # name: mch-gw

  # Home frequency for the gateway.
  # If set, mchd forces the gateway to these settings on startup - useful after
  # a crash or a factory-reset radio that has reverted to default settings.
  # After every per-node radio-tuple switch, the gateway is always restored here.
  # If not set, mchd leaves the gateway on whatever frequency it is already on.
  #
  # freq, bw, and sf must match the mesh you are joining - nodes cannot hear each
  # other if these differ. cr can be set independently per node (it is included in
  # the LoRa packet header so receivers do not need to match it).
  # Check the MeshCore app preset list for your region, or ask on the MeshCore
  # community channels to find out what your local mesh is using.
  radio:
    freq: 915.075   # MHz - must match the mesh
    bw: 125         # kHz bandwidth (common values: 62.5, 125, 250)
                    # must match the mesh
    sf: 9           # spreading factor (7-12); lower is faster, higher reaches further
                    # must match the mesh
    cr: 5           # coding rate (5=4/5, 6=4/6, 7=4/7, 8=4/8); higher adds more
                    # redundancy at the cost of airtime; can differ from other nodes

  # Send an advertisement on daemon restart so neighbors re-discover the gateway.
  # "never" (default): no advert sent.
  # "zerohop": send advert.zerohop on startup - reaches only immediate neighbors.
  # advert_on_start: never

scheduler:
  # Each node is synced roughly once per this many days, spread randomly across
  # the window to avoid a surge when the daemon restarts.
  # Can be fractional: 0.5 = every 12 hours, 7 = weekly.
  sync_interval_days: 1

  # Pause between nodes - avoids hammering the mesh. Raise this if you have
  # many nodes or a busy channel.
  inter_node_delay_seconds: 120

db_path: /var/lib/meshherder/mch.db
socket_path: /run/meshherder/mchd.sock
secrets_file: /etc/meshherder/secrets.yaml   # optional; defaults to secrets.yaml in the same directory as config.yaml

# Profiles file for 'mch suggest'. Three options (in priority order):
#
#   profiles_file: /etc/meshherder/profiles.yaml   # use a local override file
#   profiles_url:  https://example.com/profiles.yaml  # fetch on startup, cached 24h
#   (neither)                                          # use the bundled default
#
# The bundled default covers AU/NZ 915 MHz settings. Override if your region uses
# different RF settings or you want to tune the neighbour-count thresholds.
# profiles_file: /etc/meshherder/profiles.yaml
# profiles_url:  https://raw.githubusercontent.com/rdmarsh/meshherder/main/src/mch/data/profiles.yaml

# Facts collected from every node each sync cycle (read-only CMDB data).
# All fact commands run within a single node session; inter_node_delay_seconds
# sits between nodes, not between individual fact commands. 'ver' and 'board'
# use the bare command; everything else uses 'get <key>'.
facts:
  - ver          # firmware version, e.g. "v1.14.1-467959c (Build: 20-Mar-2026)"
  - board        # hardware name, e.g. "T-Beam Supreme"
  - role         # node role: "repeater", "room server", etc.
  - owner.name   # operator name set on the node
  - lat          # latitude - stored per-node for network planning and mapping tools
  - lon          # longitude
  - neighbors    # neighbour count - used by 'mch suggest' to suggest txdelay settings

# Messenger: incoming DM commands and cycle announcements.
messenger:
  # Only nodes whose public key starts with one of these prefixes can issue DM
  # commands to mchd. Get the public key from 'mch contacts' or 'meshcli list'.
  # The mesh protocol only includes the first 12 characters of a public key in
  # messages, so only those 12 characters are actually checked - 12 characters is
  # sufficient. Using the full key is fine too and makes the intent unambiguous.
  # Leave as [] to disable DM commands entirely.
  allowed_prefixes:
    - e6a56d4452ad   # Alice portable

  # Channel slot number to post sync cycle summaries to (e.g. a channel named
  # "#mch"). MeshCore uses numbered slots - slot 0 is the first channel shown
  # in the app. Omit or set to null to disable channel announcements.
  # announce_channel: 1

# Read-only HTTP API for local integrations and a future dashboard.
# Disabled by default. It exposes normalized fleet/node status, facts (including
# lat/lon for a future map), issues, planned actions, and logs. It does not expose
# sync, exec, commission, or any write operation.
# Until API authentication exists, mchd only permits loopback binds.
# api:
#   enabled: true
#   host: 127.0.0.1
#   port: 8743

# Setting policies control what mchd does when it checks a setting on a node.
# Checks happen at each scheduled sync cycle for the node - not continuously.
# When a node's turn comes up in the scheduler, mchd reads the current value
# and acts according to the policy:
#
#   enforce - if the current value differs from 'desired', write the desired
#             value. The node will be corrected at its next sync cycle.
#   audit   - read the current value and compare to 'desired'; log drift but
#             never write. Use this to track settings you manage manually.
#   skip    - do not read or write this key at all. Use for settings you want
#             to leave completely alone.
#
# The hardcoded fallback is audit. mchd only writes when a setting, node, group,
# or global block explicitly says policy: enforce or default_policy: enforce.
#
# The 'default_policy' on global, group, or node config applies to every key
# that does not have its own explicit policy. Individual keys can override the
# default. Prefer per-setting policy while introducing a node or mixed group.
# Use default_policy: enforce only where most declared settings should be written.

# Global: shared defaults for every configured node. Groups override global
# settings; nodes override groups. This is optional.
global:
  default_policy: audit
  settings:
    # Visible to guest logins and remote operators. Keep it operator-friendly.
    # URLs are clickable when someone logs in as guest. If you want a clickable
    # project attribution, use:
    #   owner.info: "Managed with https://meshherder.com"
    owner.info: "Managed with Mesh Herder"
    radio: "915.075,125,9,5"

# Groups: shared settings and policies applied to all nodes in the group.
# A node inherits global settings, then its group settings, then applies its
# own per-node overrides on top. Groups are optional - nodes can also be
# configured fully standalone.
groups:
  - name: default
    default_policy: audit
    settings:
      flood.advert.interval: "47"  # hours
      advert.interval: "238"       # minutes
      multi.acks: "1"
      path.hash.mode: "1"

  - name: repeaters
    default_policy: enforce
    settings:
      # Two ways to configure a setting key:
      #
      # Short form - just the desired value; policy comes from the group/node default:
      #   owner.info: "Managed with Mesh Herder"
      #
      # Long form - desired value plus an explicit policy and/or check frequency:
      #   owner.info:
      #     desired: "Managed with Mesh Herder"
      #     policy: enforce
      #     poll_hours: 12
      #
      # Use the short form when you are happy with the group's default policy.
      owner.info: "Managed with Mesh Herder"
      powersaving: "on"

  - name: solar-nodes
    default_policy: audit   # read and compare, never write
    settings:
      owner.info:
        desired: "Solar - managed with Mesh Herder"
        policy: enforce     # enforce this key even though the group default is audit
    setting_overrides:
      # setting_overrides let you apply a policy to a key for the whole group
      # without specifying a desired value. Useful when nodes in the group may
      # have different values for a key, but you want the same handling for all
      # of them - e.g. "leave this key alone on every node in this group".
      powersaving:
        policy: skip        # never read or write powersaving on solar nodes

# Nodes: one entry per managed node.
# pubkey_prefix: at least 8 hex characters of the node's public key.
# Run 'mch contacts' to see nodes visible to the gateway with their public keys.
nodes:

  # Minimal entry: group and label, inherits all group settings and policy.
  - pubkey_prefix: aabbccdd
    label: SiteA-Rooftop
    group: repeaters

  # Per-node setting overrides layered on top of group settings.
  # Settings defined here are merged with the group settings; the node entry
  # wins on any key that appears in both.
  - pubkey_prefix: eeff0011
    label: SiteB-Tower
    group: repeaters
    settings:
      owner.info: "SiteB - managed with Mesh Herder"
      tx:
        desired: "high"
        policy: enforce
        # poll_hours: how often mchd reads this key to check compliance,
        # independently of the main sync cycle. Default: every sync cycle.
        poll_hours: 12

  # Node on a non-default frequency.
  # 'via:' tells mchd to temporarily switch the gateway to this radio tuple to reach
  # the node, run the full sync, then restore the gateway's home frequency.
  # The node is otherwise managed identically to any other node.
  #
  # Short form (comma-separated: freq,bw,sf,cr) - same format as settings.radio.desired:
  - pubkey_prefix: 2fd9c7bb
    label: SiteC-Valley
    group: repeaters
    via: "916.575,62.5,7,8"   # freq MHz, bw kHz, sf, cr
  #
  # Long form (explicit keys) - useful when you want to annotate each value:
  # - pubkey_prefix: 2fd9c7bb
  #   label: SiteC-Valley
  #   group: repeaters
  #   via:
  #     freq: 916.575   # MHz
  #     bw: 62.5        # kHz
  #     sf: 7
  #     cr: 8

  # Node with recurring operations.
  # Operations are one-shot commands run on a schedule - distinct from settings,
  # which enforce a desired state. An operation just fires a command and records
  # whether it succeeded. 'every_hours' sets the minimum gap between runs; mchd
  # will run the command if it has not run successfully within that window.
  #
  # Do not use recurring operations for admin password rotation. mchd stores one
  # current admin password per node in secrets.yaml; change passwords as an
  # operator action, edit secrets.yaml immediately, reload mchd, and confirm
  # with `mch sync <prefix>`. mchd never edits config.yaml or secrets.yaml.
  - pubkey_prefix: 11223344
    label: SiteD-Remote
    group: solar-nodes
    operations:
      # Region commands are raw CLI operations, not normal `set <key> <value>`
      # settings. Use a long interval if these are one-time commissioning
      # commands that should not be repeated in normal operation.
      # MeshCore v1.15.0 and newer do not need matching `region allowf`
      # commands; `region put` plus `region save` is enough.
      - command: region put au
        every_hours: 87600   # 10 years
      - command: region put au-nsw
        every_hours: 87600
      - command: region put au-nsw-syd
        every_hours: 87600
      - command: region put au-vic
        every_hours: 87600
      - command: region save
        every_hours: 87600
      - command: clock sync
        every_hours: 6       # run if not run in the last 6 hours
      - command: reboot
        every_hours: 168     # run weekly (168 hours = 7 days)
        fire_and_forget: true  # node reboots before it can reply; treat no-response as success

  # Fully standalone node with no group.
  - pubkey_prefix: 55667788
    label: SiteE-Standalone
    default_policy: enforce
    settings:
      owner.info:
        desired: "Standalone - mch"
        policy: enforce
      powersaving:
        policy: skip
