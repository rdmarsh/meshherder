# mch - Mesh Herder
# Node passwords — copy to /etc/meshherder/secrets.yaml
#
# This file holds passwords for MeshCore nodes that require login before
# accepting remote CLI commands. mchd reads it on startup and uses the
# password the first time a node returns a "no permission" response. After
# a successful login the gateway's public key is added to the node's ACL,
# so subsequent sessions can skip login. Keep the entry here — an ACL wipe
# or fresh node will require it again.
#
# IMPORTANT: this file must be readable only by the mch user.
#   install -o mch -g mch -m 600 secrets.yaml /etc/meshherder/secrets.yaml
#
# Project: https://github.com/rdmarsh/meshherder
# Docs:    https://github.com/rdmarsh/meshherder#readme

nodes:
  # Map pubkey_prefix (from config.yaml) to the node's current admin password.
  # Prefer per-node entries for managed nodes, especially when rotating passwords
  # or when nodes have been commissioned at different times.
  #
  # Short form:
  # abc12345: hunter2
  #
  # Long form, used by mch commission and replacement workflows:
  # ff001122:
  #   password: correct-horse-battery-staple
  #   guest_password: guest-password-if-used
  #   prv_key: 001122...  # generated by `mch commission`; keep for replacement
  #
  # `mch validate` warns if a node's prv_key derives a public key that does not
  # match the config.yaml pubkey_prefix. That matters for replacement: setting
  # a mismatched private key changes the replacement hardware's public key.

  # Fleet-wide default password — used for any node not listed above.
  # Useful when all nodes truly share the same admin password, but be cautious:
  # during a password rotation, a per-node entry is clearer and safer.
  # Per-node entries always take priority over the default.
  # default:
  #   password: yourfleetpassword
