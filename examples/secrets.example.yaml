# mch - Mesh Herder
# Node passwords — copy to /usr/local/etc/mch/secrets.yaml
#
# This file holds passwords for MeshCore nodes that require login before
# accepting remote CLI commands. mchd reads it on startup and uses the
# password the first time a node returns a "no permission" response. After
# a successful login the gateway's public key is added to the node's ACL,
# so subsequent sessions can skip login. Keep the entry here — an ACL wipe
# or fresh node will require it again.
#
# IMPORTANT: this file must be readable only by the mch user.
#   install -o mch -g mch -m 600 secrets.yaml /usr/local/etc/mch/secrets.yaml
#
# Project: https://github.com/rdmarsh/mch
# Docs:    https://github.com/rdmarsh/mch#readme

nodes:
  # Map pubkey_prefix (from config.yaml) to the node's admin password.
  # abc12345: hunter2
  # ff001122: correct-horse-battery-staple

  # Fleet-wide default password — used for any node not listed above.
  # Useful when all nodes share the same admin password.
  # Per-node entries always take priority over the default.
  # default: yourfleetpassword
