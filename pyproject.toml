[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mcherd"
version = "0.1.0"
description = "MeshCore fleet management daemon"
requires-python = ">=3.11"
dependencies = [
    "meshcore>=0.1",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
mcherd = "mcherd.daemon:main"
mch    = "mcherd.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict         = true
files          = ["src"]
