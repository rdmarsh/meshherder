[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "meshherder"
version = "0.20.1"
description = "Fleet configuration management for MeshCore nodes"
requires-python = ">=3.11"
dependencies = [
    "meshcore>=0.1",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
mchd = "mch.daemon:main"
mch  = "mch.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mch" = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
pythonpath  = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict         = true
files          = ["src"]

[[tool.mypy.overrides]]
module = ["meshcore", "meshcore.*"]
ignore_missing_imports = true
